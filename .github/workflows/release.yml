name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck / compile
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Build Windows installers
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # bigint-buffer optional native rebuild not required (JS fallback)
          npm_config_build_from_source: "false"

      - name: Build macOS (unsigned arm64 + x64)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish never
        env:
          # No Apple Developer certs — ship unsigned; document Gatekeeper Open.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          npm_config_build_from_source: "false"

      - name: List release artifacts
        shell: bash
        run: ls -lah release/ || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solana-sniper-bot-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.yml
            release/*.yaml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: solana-sniper-bot-win
          path: artifacts/win

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: solana-sniper-bot-mac
          path: artifacts/mac

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p dist-assets
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -print -exec cp {} dist-assets/ \;
          ls -lah dist-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Solana Sniper Bot ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Downloads

            End users: download an installer below — **no `npm install` required**.

            | Platform | Recommended |
            |---|---|
            | **Windows** | `Solana Sniper Bot-*-Windows-x64.exe` (NSIS installer) or `*-portable.exe` |
            | **macOS Apple Silicon** | `Solana Sniper Bot-*-macOS-arm64.dmg` |
            | **macOS Intel** | `Solana Sniper Bot-*-macOS-x64.dmg` |

            ### macOS Gatekeeper (unsigned build)

            This release is **not notarized** (no Apple Developer certificate in CI).
            On first open: right-click the app → **Open** → confirm. Or allow it under
            System Settings → Privacy & Security.

            ### Developers

            Clone the repo and run `npm install` then `npm run desktop` for local Electron development.
          files: |
            dist-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
